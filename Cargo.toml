[package]
name = "transcrust"
default-run = "transcrust"
version = "0.1.0"
edition = "2021"
description = "Observable Parakeet-only push-to-talk voice input agent"

[workspace]
members = [".", "crates/core", "crates/decision", "crates/ffi", "crates/phonon"]
default-members = ["."]
resolver = "2"

[dependencies]
transcrust-core = { path = "crates/core", features = ["asr"] }
transcrust-decision = { path = "crates/decision" }
transcrust-phonon = { path = "crates/phonon" }
candle-core = "0.9.2"
half = "2"
rayon = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "time", "signal", "io-util"] }
cpal = "0.15"
evdev = { version = "0.12", features = ["tokio"] }
ksni = "0.2"
wl-clipboard-rs = "0.8"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"
mimalloc = { version = "0.1", default-features = false }
tokio-stream = "0.1"
harper-core = { version = "1", default-features = false }
parakeet-rs = { version = "0.3.5", default-features = false, features = ["cpu"] }
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native"] }
ndarray = "0.17"
realfft = "3"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
regex = "1"
fancy-regex = "0.14"
# Only for the offline paths (`--bench`, `--parakeet-direct <DIR> <WAV>`):
# through the engine off the hotkey. Already in the tree as a transitive dep.
hound = "3"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
unicode-segmentation = "1"
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[features]
thx-probe = []
d3-probe = []
schema-probe = []

[[bin]]
name = "thx-probe"
path = "tools/thx-probe/main.rs"
required-features = ["thx-probe"]

[[bin]]
name = "pair-probe"
path = "tools/cross-encoder-probe/main.rs"

[[bin]]
name = "d1-context-probe"
path = "tools/d1-context-probe/main.rs"

[[bin]]
name = "d3-probe"
path = "tools/d3-probe/main.rs"
required-features = ["d3-probe"]

[[bin]]
name = "schema-probe"
path = "tools/schema-probe/main.rs"
required-features = ["schema-probe"]

[[bin]]
name = "vela-probe"
path = "tools/vela-probe/main.rs"

[[bin]]
name = "ultra-text-baseline"
path = "tools/vela-probe/ultra-baseline.rs"
