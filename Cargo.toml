[package]
name = "transcrust"
version = "0.1.0"
edition = "2021"
description = "Observable Parakeet-only push-to-talk voice input agent"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "time", "signal", "io-util"] }
cpal = "0.15"
evdev = { version = "0.12", features = ["tokio"] }
ksni = "0.2"
wl-clipboard-rs = "0.8"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
mimalloc = { version = "0.1", default-features = false }
tokio-stream = "0.1"
harper-core = { version = "1", default-features = false }
parakeet-rs = { version = "0.3.5", default-features = false, features = ["cpu"] }
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native"] }
ndarray = "0.17"
realfft = "3"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
regex = "1"
fancy-regex = "0.14"
rphonetic = { version = "3.0.6", default-features = false, features = ["embedded_bm"] }
# Only for the offline paths (`--bench`, `--parakeet-direct <DIR> <WAV>`):
# through the engine off the hotkey. Already in the tree as a transitive dep.
hound = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
