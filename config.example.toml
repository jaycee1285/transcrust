# Transcrust configuration
# Default location: ~/.config/transcrust/config.toml

[hotkey]
# Cycle to the next mode. Unset by default so it does not claim a chord on a
# keyboard-driven desktop that already has a full keymap. Same rules as the
# tray switcher: the swap is refused unless the app is idle.
# mode_key = "M"
# mode_modifiers = ["RightAlt"]
key = "Space"
modifiers = ["LeftAlt"]
# device = "/dev/input/event3"

[audio]
# device = "default"

[model]
# Optional override pinning one model directory. Leave it unset to let
# transcrust discover every installed model instead — install both families
# side by side under ~/.local/share/transcrust/models/ and the tray grows an
# "Engine" submenu to switch between them at runtime.
#
# Discovery keys on the family word at the start of the directory name
# ("parakeet-…", "granite-…"), then confirms by contents. Within a directory
# the best quantisation wins: int8, then int4, then fp32.
#
# A Parakeet directory needs:
#   encoder*.onnx
#   decoder_joint*.onnx
#   vocab.txt
# A Granite directory needs:
#   *.onnx  (anything that is not encoder*/decoder*)
#   tokenizer.json
#
# When nothing is pinned and both are installed, Parakeet is the default.
# path = "/home/user/.local/share/transcrust/models/granite-speech-5.0-470m-turboctc"
# For a one-off run, TRANSCRUST_MODEL_PATH overrides this setting.

[output]
wtype = true
clipboard = true

[observe]
desktop_notifications = true
sample_chars = 120
