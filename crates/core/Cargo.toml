[package]
name = "transcrust-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
asr = ["dep:ort", "dep:ndarray", "dep:realfft"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
regex = "1"
fancy-regex = "0.14"
hound = "3"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "ndarray"], optional = true }
ndarray = { version = "0.17", optional = true }
realfft = { version = "3", optional = true }
