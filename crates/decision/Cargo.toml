[package]
name = "transcrust-decision"
version = "0.1.0"
edition = "2021"

[dependencies]
transcrust-core = { path = "../core" }
candle-core = "0.9.2"
half = "2"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"
regex = "1"
# Word readings (noun number/countability, determiners, prepositions) for the
# sounds-like gate. Apache-2.0; already a dependency of the root crate.
harper-core = { version = "1", default-features = false }
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "ndarray"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
